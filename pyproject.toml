[project]
name = "converter"
version = "0.5.0"
description = "Convert multi-room tournament and cash hand histories for Hand2Note 3"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.2",
    "pillow>=10.0",
]

[project.scripts]
hh-converter = "converter.cli:main"
hh-converter-gui = "converter.gui:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["converter*"]

[tool.setuptools.package-data]
converter = ["assets/*"]
